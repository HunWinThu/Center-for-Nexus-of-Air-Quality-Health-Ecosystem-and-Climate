version: '3.8'

services:
  # Development service
  dev:
    build:
      context: .
      target: development
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true
    stdin_open: true
    tty: true
    command: npm run dev -- --host

  # Production build and serve
  prod:
    build:
      context: .
      target: production
    ports:
      - "8080:80"
    restart: unless-stopped
